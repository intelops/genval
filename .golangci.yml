version: "2"

run:
  timeout: 10m
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - dupl
  settings:
    dupl:
      threshold: 400

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
